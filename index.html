<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>후쿠오카 여행앱 이동</title>
<meta http-equiv="refresh" content="0;url=https://script.google.com/macros/s/AKfycbxUY5_LBbZ93hl516Xd8pGvH9dk2j149c_Cg0t371FW3qUV4y44MuTbs1bg3d_aL7LG/exec">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:#111412;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;text-align:center;padding:24px}a{color:#0e6b52;font-weight:700}</style>
</head>
<body>
<div><h1 style="font-size:22px">여행앱 주소가 바뀌었어요</h1><p>잠시 후 새 주소로 이동해요.<br>이동하지 않으면 <a href="https://script.google.com/macros/s/AKfycbxUY5_LBbZ93hl516Xd8pGvH9dk2j149c_Cg0t371FW3qUV4y44MuTbs1bg3d_aL7LG/exec">여기</a>를 눌러 주세요.</p></div>
<script>
try{localStorage.clear()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
location.replace("https://script.google.com/macros/s/AKfycbxUY5_LBbZ93hl516Xd8pGvH9dk2j149c_Cg0t371FW3qUV4y44MuTbs1bg3d_aL7LG/exec");
</script>
</body>
</html>
